<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo" id="logo"></div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <button class="theme-btn" onclick="changeTheme()">🌙</button>
    </nav>

    <section id="home" class="home">
        <h1>Hello, I'm <span id="name"></span></h1>
        <p id="title"></p>
        <a href="#projects" class="btn">View My Work</a>
    </section>

    <section id="about" class="section">
        <h2>About Me</h2>
        <p id="about-text"></p>
        <p><b>Email:</b> <span id="email"></span></p>
        <p><b>City:</b> <span id="city"></span></p>
    </section>

    <section id="skills" class="section">
        <h2>Skills</h2>
        <div id="skills-list"></div>
    </section>

    <section id="projects" class="section">
        <h2>Projects</h2>
        <div id="projects-list" class="projects"></div>
    </section>

    <section id="contact" class="section">
        <h2>Contact Me</h2>
        <form action="php/contact.php" method="POST" class="contact-form">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
            <button type="submit" class="btn">Send</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Bshr</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
